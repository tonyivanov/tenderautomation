# search_queries.yaml — PRODUCTION словарь
#
# Это финальный набор поисковых запросов, отобранный после трёх итераций
# на B2B-Center. Сюда входят ТОЛЬКО ключи, которые на реальных прогонах
# давали целевые тендеры с минимумом шума.
#
# ИСТОРИЯ ОТБОРА:
#   1-й прогон (125 запросов): дал базовый набор находок (Мосбиржа, АК БАРС,
#                              Уралсиб, ЗЕНИТ, Кубань Кредит, БС-Платформа)
#   2-й прогон (137 запросов другого типа): большинство дали шум
#                              (МЕС/IDS/АБС/ВКС ловят артикулы оборудования)
#   3-й прогон (150 длинных фраз): часть точечно сработала (FortiGate,
#                              Vinchin, АПКШ Континент, Atlassian)
#
# ЧТО НЕ ВКЛЮЧЕНО И ПОЧЕМУ:
#   - Короткие 3-4 буквенные коды (SRE, КИИ, IDS, МЕС, АБС, ВКС, 1С) —
#     ловят случайные совпадения в артикулах оборудования
#   - "анализ рынка", "оказание услуг по", "выполнение работ по" — слишком
#     общие, дают сотни нерелевантных
#   - "АСУТП", "АСУ ТП" — это не наш профиль, ловят заводские тендеры
#   - "система дистанционного" — ловит "дистанционное управление" в спецтехнике
#   - "управление доступом" — ловит СКУД пропускных систем
#
# ВРЕМЯ ПРОГОНА: ~5-7 минут с паузами 2-4 сек между запросами

