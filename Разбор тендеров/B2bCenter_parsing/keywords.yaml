# keywords.yaml — правила префильтра по названию и категории тендера
#
# Логика:
#   1. blacklist приоритетнее whitelist
#   2. совпадение по подстроке, регистр игнорируется
#   3. срабатывает на (название + категория)
#
# Поправил файл — запусти 2_fetch.bat. Префильтр перепроверит ВСЁ.

# ============================================================================
# WHITELIST — если эти слова в названии/категории, тендер попадает в кандидаты
# ============================================================================
whitelist_keywords:
  # Базовая инфраструктура
  - инфраструктур
  - сервер           # ОПАСНО: даёт много шума, см. blacklist ниже
  - дата-центр
  - датацентр
  - цод
  - кластер

  # Облако и виртуализация
  - облак
  - cloud
  - виртуализаци
  - vmware
  - kvm
  - kubernetes
  - openshift
  - openstack
  - контейнер        # ОПАСНО: тоже даёт шум, см. blacklist

  # DevOps / эксплуатация
  - devops
  - sre
  - ci/cd
  - cicd
  - мониторинг       # ОПАСНО: см. blacklist (мониторинг рынка)
  - prometheus
  - grafana
  - zabbix

  # БД и хранилища
  - postgres
  - postgresql
  - mysql
  - opensearch
  - elasticsearch
  - clickhouse
  - mongodb
  - redis
  - kafka
  - rabbitmq

  # ОС и софт
  - linux
  - астра линукс
  - astralinux
  - red os
  - redos
  - alt linux

  # Безопасность
  - информационн
  - кибербезопасн
  - asm
  - dsp
  - siem
  - waf
  - soc
  - vpn
  - vipnet
  - pentest
  - пентест
  - аудит безопасн
  - кии              # критическая информационная инфраструктура
  - 187-фз
  - 152-фз

  # Бэкап / DR
  - резервн копир
  - backup
  - восстановлен данн
  - disaster recovery
  - отказоустойчив

  # Архитектура / аудит
  - аудит ит
  - аудит инфраструктур
  - it-аудит
  - архитектур реш
  - техническ архитектур
  - it-стратеги
  - ит-стратеги

  # Миграции
  - миграци

  # AI / ML
  - искусственн интеллект
  - машинн обучен
  - llm
  - ml-платформ
  - ai-ассистент
  - ии-ассистент
  - ai-помощник
  - ии-помощник
  - чат-бот
  - чатбот

  # Сети
  - локальн сет
  - lan
  - sd-wan
  - cisco           # ОПАСНО: может быть железо
  - huawei          # ОПАСНО: может быть железо

  # Поддержка / сопровождение
  - сопровожден it
  - сопровожден ит
  - техническ поддержк
  - it-поддержк
  - ит-поддержк


# ============================================================================
# BLACKLIST — если есть эти слова, тендер сразу отсеивается
# Расширенный под специфику B2B-Center (промышленность, металлургия, неликвид)
# ============================================================================
blacklist:
  # === Продажи неликвида (на B2B-Center их особенно много, М.Видео и др.) ===
  - объявление о продаж
  - неремонтопригодн
  - нрп
  - уцененн
  - утилизац
  - металлолом

  # === Промышленность / металлургия ===
  - поковк
  - подшипник
  - редуктор
  - грохот
  - сит для грохот
  - валок
  - стальн прокат
  - металлопрокат
  - прессштемпел
  - вакуумн насос
  - водокольцев
  - крепления пресс
  - буровое
  - горно-шахтн
  - горношахтн
  - гок                  # горно-обогатительный комбинат
  - металлоинвест        # частый шум на B2B-Center
  - поставка машин для
  - отсадк начин
  - технологическ оборудован

  # === Энергетика / нефтегаз / тепло ===
  - тэц
  - укпг
  - топливоиспользован
  - энергоаудит
  - нефтегаз
  - газораспредел
  - газопровод
  - теплос
  - котельн
  - турбин

  # === Строительство / ЖКХ ===
  - смр
  - капитальн ремонт здан
  - капремонт
  - кровл
  - фасад
  - дорожн работ
  - благоустройств
  - озеленен
  - инженерн систем
  - электромонтажн
  - сантехническ

  # === Транспорт / логистика ===
  - автотранспорт
  - автобус
  - грузопер
  - перевозк груз
  - цистерн
  - автомобил перевоз

  # === Сервер для видеонаблюдения / охранной системы (ловушка для whitelist) ===
  - видеонаблюден
  - охранн сигнализац
  - пожарн сигнализац
  - охранно-пожарн
  - пожаротушен

  # === Серверные стойки / поставка железа без услуг ===
  - стойк серверн
  - поставка серверов
  - поставка коммутатор
  - поставка маршрутизатор
  - поставка системы хранен

  # === Хозтовары, посуда, продукты ===
  - хозтовар
  - канцтовар
  - одноразов посуд
  - посуд
  - продукт питан
  - продовольств

  # === ОПО / промбезопасность (не наше) ===
  - опасн производственн
  - промышленн безопасн
  - экспертиз промышленн
  - оценк риск взрыв

  # === Финансовые и закупочные термины (мониторинг РЫНКА, а не систем) ===
  - мониторинг рынк
  - мониторинг цен
  - анализ рынк

  # === Сопровождение НЕ-IT ===
  - сопровожден 1с
  - сопровожден sap
  - сопровожден crm-стратег
  - сопровожден торгов
  - сопровожден закуп

  # === Прочие категории-ловушки ===
  - подсолнечн
  - сахарн
  - кулинар
  - биотопл
  - пищев промышл
  - текстил
  - химическ реагент
  - удобрен
  - сельхоз
