# Ключевые слова для предварительной фильтрации тендеров.
# Регистр НЕ важен. Совпадение по подстроке.
# Используются "обрубленные" формы (например "инфраструктур"), чтобы
# ловить разные падежи: "инфраструктура", "инфраструктуре", "инфраструктуры".
#
# Меняй смело — скрипт перечитывает файл при каждом запуске.

# Если в названии встретилось любое слово отсюда — тендер становится КАНДИДАТОМ (score=100).
