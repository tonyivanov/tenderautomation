# GIS TenderAutomation — Qualification Rules
# Format: each rule has id, phrases, score, type, strong_marker, minimum_category, exceptions, forbidden_context, required_context

rules:
  # =========================================================================
  # HARD STOP RULES
  # =========================================================================

  # --- Sites & web development ---
  - id: website_creation
    phrases: ["создание сайта", "разработка сайта", "доработка сайта"]
    score: 0
    type: hard_stop
    category: hard_stop
    exceptions:
      any: ["инфраструктура сайта", "серверы сайта", "devops", "kubernetes"]

  - id: website_support
    phrases: ["поддержка сайта", "сопровождение сайта", "развитие сайта", "администрирование сайта", "администрирование сайтов"]
    score: 0
    type: hard_stop
    category: hard_stop
    exceptions:
      any: ["инфраструктура сайта", "серверы сайта", "devops", "kubernetes"]

  - id: website_promotion
    phrases: ["продвижение сайта", "продвижение сайтов", "seo-продвижение", "seo продвижение", "рекламные лендинги", "редизайн сайта"]
    score: 0
    type: hard_stop
    category: hard_stop

  - id: website_general
