[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-automation"
version = "0.1.0"
description = "Automated tender monitoring and qualification system"
requires-python = ">=3.10"
dependencies = [
    "SQLAlchemy>=2.0.36",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.2.2",
    "click>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "hypothesis>=6.112.0",
    "mypy>=1.20.2,<2",
    "pytest-cov>=5.0.0",
    "types-PyYAML>=6.0.12.20260518",
    "types-beautifulsoup4>=4.12.0.20250516",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[project.scripts]
tender-pipeline = "core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "migrations/*"]

[tool.coverage.report]
fail_under = 60
precision = 2
