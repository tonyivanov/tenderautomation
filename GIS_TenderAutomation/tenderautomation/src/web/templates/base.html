<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TenderAutomation{% endblock %}</title>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <link rel="stylesheet" href="/static/custom.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" data-testid="main-nav">
    <div class="container-fluid">
      <a class="navbar-brand" href="/tenders">TenderAutomation</a>
      {% if current_user is defined %}
      <div class="d-flex align-items-center gap-3">
        <a class="nav-link text-light" href="/tenders" data-testid="nav-tenders-link">
          Тендеры
          {% if unread_count is defined and unread_count > 0 %}
          <span class="badge bg-danger ms-1" data-testid="nav-unread-badge">{{ unread_count }}</span>
          {% endif %}
        </a>
        <a class="nav-link text-light" href="/v3">
          V3
        </a>
        <a class="nav-link text-light" href="/shortlist">
          📋
        </a>
        <a class="nav-link text-light" href="/history" data-testid="nav-history-link">История</a>
        <a class="nav-link text-light" href="/admin">
          ⚙️
        </a>
        {% if commit_id is defined %}
        <span class="badge bg-secondary font-monospace" data-testid="admin-commit-id">
          commit {{ commit_id }}
        </span>
        {% endif %}
        <span class="text-secondary small">{{ current_user.username }}</span>
        <form action="/logout" method="post" class="d-inline">
          <button type="submit" class="btn btn-sm btn-outline-light" data-testid="nav-logout-btn">Выйти</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container-fluid py-3">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmig7Z7Bpn5RTnk0b3Cm01rN6s"
    crossorigin="anonymous"></script>
</body>
</html>
